       measured colors — charcoal circle rgb(64,64,64), cream swan
       rgb(244,236,214). Vector source of truth for every brand asset:
       src/app/favicon.ico, apple-icon.png, public/icons/icon-{192,512}.png,
       and the opengraph-image card. -->
